<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chladni Sand — standing waves made visible</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #0a0a0f; color: #ddd;
    font-family: -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  canvas { display: block; background: #050507; touch-action: none; }
  #stage { flex: 1; position: relative; }
  #panel {
    padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 14px;
    align-items: center; background: #12121a; border-top: 1px solid #262633;
    font-size: 13px;
  }
  #panel label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #panel input[type=range] { width: 110px; }
  button {
    background: #262633; color: #eee; border: 1px solid #3a3a4a; border-radius: 6px;
    padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #33334a; }
  #readout { color: #8a8aa0; margin-left: auto; }
  code { color: #f0c674; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="panel">
    <label>mode n <input id="n" type="range" min="1" max="12" value="3" step="1"><span id="nv">3</span></label>
    <label>mode m <input id="m" type="range" min="1" max="12" value="5" step="1"><span id="mv">5</span></label>
    <label>jitter <input id="jitter" type="range" min="1" max="60" value="22" step="1"><span id="jv">22</span></label>
    <button id="shuffle">shuffle sand</button>
    <button id="pause">pause</button>
    <span id="readout">grains settle on the plate's nodal lines — where it isn't vibrating</span>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');

function resize() {
  canvas.width = stage.clientWidth;
  canvas.height = stage.clientHeight;
}
window.addEventListener('resize', resize);
resize();

const N = 6000;
let px = new Float32Array(N);
let py = new Float32Array(N);

function scatter() {
  for (let i = 0; i < N; i++) {
    px[i] = Math.random() * 2 - 1;
    py[i] = Math.random() * 2 - 1;
  }
}
scatter();

const nSlider = document.getElementById('n');
const mSlider = document.getElementById('m');
const jSlider = document.getElementById('jitter');
const nv = document.getElementById('nv');
const mv = document.getElementById('mv');
const jv = document.getElementById('jv');

nSlider.oninput = () => nv.textContent = nSlider.value;
mSlider.oninput = () => mv.textContent = mSlider.value;
jSlider.oninput = () => jv.textContent = jSlider.value;

document.getElementById('shuffle').onclick = scatter;

let paused = false;
const pauseBtn = document.getElementById('pause');
pauseBtn.onclick = () => {
  paused = !paused;
  pauseBtn.textContent = paused ? 'resume' : 'pause';
};

// Chladni eigenmode of a square plate, free-edge boundary, modes (n, m):
// U(x, y) = cos(n*pi*x) * cos(m*pi*y) - cos(m*pi*x) * cos(n*pi*y)
// U == 0 along the nodal lines -- the plate isn't moving there, so grains
// resting nearby barely get kicked and pile up. Everywhere else the plate is
// vibrating, so grains near an antinode get knocked around at random until
// they wander close enough to a node to stop.
function amplitude(x, y, n, m) {
  const a = Math.cos(n * Math.PI * x) * Math.cos(m * Math.PI * y);
  const b = Math.cos(m * Math.PI * x) * Math.cos(n * Math.PI * y);
  return a - b;
}

function step() {
  const n = +nSlider.value;
  const m = +mSlider.value;
  const jitter = +jSlider.value / 4000;
  for (let i = 0; i < N; i++) {
    const x = px[i], y = py[i];
    const u = Math.abs(amplitude(x, y, n, m));
    const kick = jitter * u;
    const angle = Math.random() * Math.PI * 2;
    let nx = x + Math.cos(angle) * kick;
    let ny = y + Math.sin(angle) * kick;
    if (nx < -1) nx = -1; if (nx > 1) nx = 1;
    if (ny < -1) ny = -1; if (ny > 1) ny = 1;
    px[i] = nx; py[i] = ny;
  }
}

function draw() {
  const w = canvas.width, h = canvas.height;
  const side = Math.min(w, h) * 0.92;
  const ox = (w - side) / 2, oy = (h - side) / 2;

  ctx.fillStyle = '#050507';
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = '#22222e';
  ctx.lineWidth = 2;
  ctx.strokeRect(ox, oy, side, side);

  ctx.fillStyle = '#e8e2d0';
  for (let i = 0; i < N; i++) {
    const sx = ox + (px[i] + 1) / 2 * side;
    const sy = oy + (py[i] + 1) / 2 * side;
    ctx.fillRect(sx, sy, 1.3, 1.3);
  }
}

function loop() {
  if (!paused) step();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
