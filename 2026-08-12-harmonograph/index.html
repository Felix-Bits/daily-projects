<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harmonograph</title>
<style>
  :root {
    --bg: #0b0c10;
    --panel: #14161c;
    --ink: #f2efe6;
    --accent: #ffb454;
    --line: #2a2d36;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #wrap { position: relative; width: 100%; height: 100%; }
  canvas { display: block; background: #050506; }
  #hud {
    position: absolute; top: 12px; left: 12px;
    background: rgba(20, 22, 28, 0.88);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    width: 250px;
    font-size: 12px;
    backdrop-filter: blur(4px);
  }
  #hud h1 {
    font-size: 14px; margin: 0 0 8px 0; letter-spacing: 0.03em;
    color: var(--accent); font-weight: 600;
  }
  .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .row label { width: 90px; color: #9a9da6; flex-shrink: 0; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  .row span { width: 34px; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  .btns { display: flex; gap: 6px; margin-top: 10px; }
  button {
    flex: 1; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 4px; font-size: 11px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  #hint {
    margin-top: 8px; color: #6b6e78; font-size: 10.5px; line-height: 1.4;
  }
  #toggle {
    position: absolute; top: 12px; right: 12px;
    background: rgba(20,22,28,0.88); border: 1px solid var(--line);
    color: var(--ink); border-radius: 6px; padding: 6px 10px;
    font-size: 11px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <button id="toggle">hide panel</button>
  <div id="hud">
    <h1>HARMONOGRAPH</h1>
    <div id="sliders"></div>
    <div class="btns">
      <button id="randomize">randomize</button>
      <button id="clear">clear</button>
      <button id="pause">pause</button>
    </div>
    <div id="hint">Four damped pendulums drive X and Y. Drag sliders to detune frequencies (small ratios like 2:3 give clean rosettes; irrational ratios never quite close).</div>
  </div>
</div>
<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
  redrawBackground();
}
function redrawBackground() {
  ctx.fillStyle = "#050506";
  ctx.fillRect(0, 0, W, H);
}

// Pendulum state: two pairs drive X, two drive Y.
// x(t) = Ax1*sin(t*Fx1+Px1)*exp(-Dx1*t) + Ax2*sin(t*Fx2+Px2)*exp(-Dx2*t)
// y(t) = Ay1*sin(t*Fy1+Py1)*exp(-Dy1*t) + Ay2*sin(t*Fy2+Py2)*exp(-Dy2*t)
let params = {
  Fx1: 3, Fx2: 2, Fy1: 2, Fy2: 3,
  Px1: 0.0, Px2: 0.0, Py1: 1.5708, Py2: 0.0,
  damp: 0.06,       // shared damping coefficient
  amp: 0.9,         // overall amplitude scale
};

let t = 0;
let hue = 30;
let running = true;
let path = { x: null, y: null };

function scale() {
  return Math.min(W, H) * 0.38 * params.amp;
}

function pos(t) {
  const d = params.damp;
  const s = scale();
  const x = s * (
    Math.sin(t * params.Fx1 + params.Px1) * Math.exp(-d * t * 0.15) * 0.6 +
    Math.sin(t * params.Fx2 + params.Px2) * Math.exp(-d * t * 0.15) * 0.4
  );
  const y = s * (
    Math.sin(t * params.Fy1 + params.Py1) * Math.exp(-d * t * 0.15) * 0.6 +
    Math.sin(t * params.Fy2 + params.Py2) * Math.exp(-d * t * 0.15) * 0.4
  );
  return [cx + x, cy + y];
}

const DT = 0.02;
const STEPS_PER_FRAME = 12;

function step() {
  if (!running) return;
  ctx.lineWidth = 1.1;
  for (let i = 0; i < STEPS_PER_FRAME; i++) {
    const [x, y] = pos(t);
    if (path.x !== null) {
      hue += 0.06;
      ctx.strokeStyle = `hsla(${hue % 360}, 70%, 65%, 0.85)`;
      ctx.beginPath();
      ctx.moveTo(path.x, path.y);
      ctx.lineTo(x, y);
      ctx.stroke();
    }
    path.x = x; path.y = y;
    t += DT;
  }
}

function loop() {
  step();
  requestAnimationFrame(loop);
}

function resetDrawing(newT) {
  redrawBackground();
  t = newT !== undefined ? newT : 0;
  path = { x: null, y: null };
}

// ---- UI ----
const sliderDefs = [
  { key: "Fx1", label: "freq X1", min: 0.5, max: 8, step: 0.001 },
  { key: "Fx2", label: "freq X2", min: 0.5, max: 8, step: 0.001 },
  { key: "Fy1", label: "freq Y1", min: 0.5, max: 8, step: 0.001 },
  { key: "Fy2", label: "freq Y2", min: 0.5, max: 8, step: 0.001 },
  { key: "Px1", label: "phase X2", min: 0, max: 6.283, step: 0.01 },
  { key: "Py1", label: "phase Y1", min: 0, max: 6.283, step: 0.01 },
  { key: "damp", label: "damping", min: 0.0, max: 0.4, step: 0.001 },
  { key: "amp", label: "amplitude", min: 0.3, max: 1.2, step: 0.01 },
];

const slidersEl = document.getElementById("sliders");
const rowEls = {};

sliderDefs.forEach(def => {
  const row = document.createElement("div");
  row.className = "row";
  const label = document.createElement("label");
  label.textContent = def.label;
  const input = document.createElement("input");
  input.type = "range";
  input.min = def.min; input.max = def.max; input.step = def.step;
  input.value = params[def.key];
  const span = document.createElement("span");
  span.textContent = Number(params[def.key]).toFixed(2);
  input.addEventListener("input", () => {
    params[def.key] = parseFloat(input.value);
    span.textContent = params[def.key].toFixed(2);
    resetDrawing(0);
  });
  row.appendChild(label); row.appendChild(input); row.appendChild(span);
  slidersEl.appendChild(row);
  rowEls[def.key] = { input, span };
});

function syncSliders() {
  sliderDefs.forEach(def => {
    rowEls[def.key].input.value = params[def.key];
    rowEls[def.key].span.textContent = Number(params[def.key]).toFixed(2);
  });
}

function randomize() {
  const nice = [1, 2, 3, 4, 5, 6, 7, 8].map(n => n + (Math.random() < 0.5 ? 0 : (Math.random() * 0.02 - 0.01)));
  params.Fx1 = nice[Math.floor(Math.random() * nice.length)];
  params.Fx2 = nice[Math.floor(Math.random() * nice.length)];
  params.Fy1 = nice[Math.floor(Math.random() * nice.length)];
  params.Fy2 = nice[Math.floor(Math.random() * nice.length)];
  params.Px1 = Math.random() * Math.PI * 2;
  params.Px2 = Math.random() * Math.PI * 2;
  params.Py1 = Math.random() * Math.PI * 2;
  params.Py2 = Math.random() * Math.PI * 2;
  params.damp = 0.02 + Math.random() * 0.15;
  params.amp = 0.7 + Math.random() * 0.4;
  syncSliders();
  resetDrawing(0);
}

document.getElementById("randomize").addEventListener("click", randomize);
document.getElementById("clear").addEventListener("click", () => resetDrawing(0));
document.getElementById("pause").addEventListener("click", (e) => {
  running = !running;
  e.target.textContent = running ? "pause" : "resume";
});
document.getElementById("toggle").addEventListener("click", (e) => {
  const hud = document.getElementById("hud");
  const hidden = hud.style.display === "none";
  hud.style.display = hidden ? "block" : "none";
  e.target.textContent = hidden ? "hide panel" : "show panel";
});

window.addEventListener("resize", () => {
  const t0 = t;
  resize();
  resetDrawing(t0);
});

resize();
randomize();
loop();
</script>
</body>
</html>
